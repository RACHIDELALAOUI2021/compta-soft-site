<svg viewBox="0 0 320 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compta Soft">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7A73" />
      <stop offset="100%" stop-color="#064843" />
    </linearGradient>
    <clipPath id="logo-clip">
      <rect x="0" y="0" width="52" height="52" rx="10" />
    </clipPath>
    <pattern id="zellige-floral" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12" />
      <circle cx="20" cy="0" r="12" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12" />
      <circle cx="0" cy="20" r="12" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12" />
      <circle cx="20" cy="20" r="12" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12" />
      <circle cx="10" cy="10" r="12" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.12" />
    </pattern>
  </defs>
  <!-- Badge icône -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="52" height="52" rx="10" fill="url(#bg-grad)" />
    <rect x="0" y="0" width="52" height="52" fill="url(#zellige-floral)" clip-path="url(#logo-clip)" />
    <rect x="2" y="2" width="48" height="48" rx="8" fill="none" stroke="#2EBAB1" stroke-width="0.7" opacity="0.4" />
    <text x="26" y="37" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="900" fill="#C1272D" stroke="#FFFFFF" stroke-width="0.8" text-anchor="middle" letter-spacing="-1">CS</text>
  </g>
  <!-- Texte horizontal sur une seule ligne -->
  <text x="66" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="800" fill="#061B3A" letter-spacing="-0.5">Compta</text>
  <text x="178" y="36" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="800" fill="#0E7A73" letter-spacing="-0.5">Soft</text>
</svg>
