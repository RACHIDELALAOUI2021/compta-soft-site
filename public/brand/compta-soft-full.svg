<svg viewBox="0 0 350 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Compta Soft">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7A73" />
      <stop offset="100%" stop-color="#064843" />
    </linearGradient>

    <clipPath id="logo-clip">
      <rect x="0" y="0" width="100" height="100" rx="20" />
    </clipPath>

    <pattern id="zellige-floral" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.12" />
      <circle cx="40" cy="0" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.12" />
      <circle cx="0" cy="40" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.12" />
      <circle cx="40" cy="40" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.12" />
      <circle cx="20" cy="20" r="25" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.12" />
    </pattern>
  </defs>

  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#bg-grad)" />
    <rect x="0" y="0" width="100" height="100" fill="url(#zellige-floral)" clip-path="url(#logo-clip)" />
    <rect x="4" y="4" width="92" height="92" rx="16" fill="none" stroke="#2EBAB1" stroke-width="1" opacity="0.4" />
    <text
      x="50"
      y="71"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="58"
      font-weight="900"
      fill="#C1272D"
      stroke="#FFFFFF"
      stroke-width="1.5"
      text-anchor="middle"
      letter-spacing="-2"
    >
      CS
    </text>
  </g>

  <g transform="translate(130, 50)">
    <text
      x="0"
      y="0"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="46"
      font-weight="800"
      fill="#061B3A"
      letter-spacing="-1"
    >
      Compta
    </text>
    <text
      x="0"
      y="45"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="46"
      font-weight="800"
      fill="#0E7A73"
      letter-spacing="-1"
    >
      Soft
    </text>
  </g>
</svg>
